<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>독일어 스터디</title>
<style>
:root{--bg:#f7f5f0;--surface:#fff;--ink:#1d1b18;--muted:#6b665e;--line:#e6e1d7;--accent:#c8102e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141311;--surface:#1f1d1a;--ink:#f1ede6;--muted:#a39d93;--line:#34302a;--accent:#ff5a6e}}
:root[data-theme="dark"]{--bg:#141311;--surface:#1f1d1a;--ink:#f1ede6;--muted:#a39d93;--line:#34302a;--accent:#ff5a6e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;line-height:1.6;word-break:keep-all}
.wrap{max-width:640px;margin:0 auto;padding:32px 16px 60px}
.flag{display:flex;height:6px;width:72px;border-radius:3px;overflow:hidden;margin-bottom:16px}
.flag i{flex:1}.flag i:nth-child(1){background:#000}.flag i:nth-child(2){background:#dd0000}.flag i:nth-child(3){background:#ffce00}
h1{font-size:28px;margin:0 0 6px}
p{color:var(--muted);margin:0 0 24px}
a.lesson{display:block;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:10px}
a.lesson small{color:var(--accent);font-weight:700}
a.lesson b{display:block;font-size:18px}
</style>
</head>
<body>
<div class="wrap">
  <div class="flag"><i></i><i></i><i></i></div>
  <h1>독일어 스터디</h1>
  <p>회차별 수업자료</p>
  <a class="lesson" href="german-01.html"><small>1회차</small><b>독일어 발음과 읽기 규칙</b></a>
</div>
</body>
</html>
